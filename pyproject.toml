[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-target-pose-estimation"
version = "0.1.0"
description = "Monocular infrared dot-board pose estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
windows-camera-name = ["pygrabber>=0.2"]

[tool.setuptools.packages.find]
include = ["ir_target_pose*"]
